# Install the package the way a local user does (pip, from pyproject) and run
# the test suite on every push and pull request.
name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the pipeline and its dependencies
        run: pip install -e ".[dev]"
      - name: Run the tests
        run: pytest tests/ -q
